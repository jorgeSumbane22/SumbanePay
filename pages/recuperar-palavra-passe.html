<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar senha — SumbanePay</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --sz-green: #176b5b;
            --sz-dark: #103f37;
            --sz-coral: #ef6d4e;
            --sz-gold: #e8b35b;
            --sz-paper: #f7f6f1;
            --sz-ink: #19362e;
            --sz-muted: #778078;
            --sz-line: #e5e3da;
            --sz-white: #ffffff;
            --sz-shadow: 0 16px 48px rgba(16, 63, 55, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--sz-paper);
            color: var(--sz-ink);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .serif { font-family: 'Georgia', 'Times New Roman', serif; }

        /* ============================================================
           BRAND
           ============================================================ */
        .brand {
            font-family: 'Georgia', serif;
            font-weight: 700;
            color: var(--sz-dark);
            font-size: 1.25rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        .brand:hover { color: var(--sz-green); transform: translateY(-1px); }
        .brand b { color: var(--sz-coral); }

        .logo-mark {
            display: inline-grid;
            place-items: center;
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--sz-green), var(--sz-dark));
            color: #fff;
            border-radius: 8px 8px 12px 4px;
            font-weight: 700;
            font-size: 0.7rem;
            box-shadow: 0 2px 8px rgba(23, 107, 91, 0.3);
            letter-spacing: 0.5px;
            transition: var(--transition);
        }
        .brand:hover .logo-mark {
            transform: rotate(-3deg) scale(1.05);
            box-shadow: 0 4px 12px rgba(23, 107, 91, 0.4);
        }

        /* ============================================================
           BOTÕES
           ============================================================ */
        .btn-sz {
            background: linear-gradient(135deg, var(--sz-green), #1a7a68);
            color: white;
            border: 0;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(23, 107, 91, 0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
            width: 100%;
        }
        .btn-sz:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(23, 107, 91, 0.35);
            color: #fff;
            background: linear-gradient(135deg, var(--sz-dark), var(--sz-green));
        }
        .btn-sz i { transition: var(--transition); }
        .btn-sz:hover i { transform: translateX(4px); }

        /* ============================================================
           EYEBROW
           ============================================================ */
        .eyebrow {
            color: var(--sz-coral);
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* ============================================================
           FORM CARD
           ============================================================ */
        .auth-container {
            width: 100%;
            max-width: 480px;
            padding: 1.5rem;
        }

        .auth-card {
            background: var(--sz-white);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: var(--sz-shadow);
            transition: var(--transition);
        }
        .auth-card:hover { box-shadow: 0 20px 60px rgba(16, 63, 55, 0.15); }

        .auth-card .text-center { margin-bottom: 1.5rem; }
        .auth-card h2 {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
        }
        .auth-card .subtitle {
            color: var(--sz-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .auth-card .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--sz-ink);
            margin-top: 0.5rem;
        }

        .auth-card .form-control {
            border-radius: 10px;
            border: 2px solid var(--sz-line);
            padding: 10px 14px;
            transition: var(--transition);
            background: var(--sz-paper);
        }
        .auth-card .form-control::placeholder {
            color: var(--sz-muted);
            opacity: 0.6;
        }
        .auth-card .form-control:focus {
            border-color: var(--sz-green);
            box-shadow: 0 0 0 4px rgba(23, 107, 91, 0.1);
        }
        .auth-card .form-control.is-invalid {
            border-color: #dc3545;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.1);
        }

        .auth-card .back-link {
            color: var(--sz-muted);
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        .auth-card .back-link:hover { color: var(--sz-green); }

        /* ============================================================
           DARK MODE
           ============================================================ */
        .dark-mode {
            --sz-paper: #12241f;
            --sz-ink: #f4f3ed;
            --sz-line: #305348;
            --sz-white: #19362e;
            --sz-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
        }
        .dark-mode .auth-card { background: var(--sz-white); }
        .dark-mode .auth-card .form-control {
            background: #102a23;
            color: #fff;
            border-color: #42675b;
        }
        .dark-mode .auth-card .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .dark-mode .auth-card .form-control:focus {
            border-color: var(--sz-gold);
            box-shadow: 0 0 0 4px rgba(232, 179, 91, 0.15);
        }
        .dark-mode .auth-card .back-link { color: rgba(255, 255, 255, 0.5); }
        .dark-mode .auth-card .back-link:hover { color: var(--sz-gold); }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 576px) {
            .auth-card { padding: 1.5rem; }
            .auth-card h2 { font-size: 1.5rem; }
            .auth-container { padding: 1rem; }
        }
        @media (max-width: 380px) {
            .auth-card { padding: 1rem; }
            .auth-card .form-control { padding: 8px 12px; font-size: 0.9rem; }
            .logo-mark { width: 28px; height: 28px; font-size: 0.55rem; }
            .brand { font-size: 1rem; }
        }
    </style>
    <link rel="stylesheet" href="../responsive.css">
    <link rel="stylesheet" href="../darkmode.css">
    <meta name="theme-color" content="#0d1c17">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">

            <!-- LOGO -->
            <div class="text-center">
                <a class="brand" href="../index.html">
                    <span class="logo-mark">Pay</span>
                    Sumbane<b>Pay</b>
                </a>
            </div>

            <!-- TÍTULO -->
            <div class="eyebrow text-center">RECUPERAÇÃO</div>
            <h2 class="serif text-center">Recupere o acesso.</h2>
            <p class="subtitle text-center">
                Informe o email da sua conta para redefinir a senha.
            </p>

            <!-- FORMULÁRIO -->
            <form id="recoverForm" onsubmit="handleRecover(event)">
                <label class="form-label" for="email">
                    <i class="bi bi-envelope me-1"></i> Email
                </label>
                <input id="email" class="form-control" type="email" 
                       placeholder="seu@email.com" 
                       autocomplete="email">

                <button type="submit" class="btn-sz mt-3">
                    <i class="bi bi-arrow-clockwise"></i> Recuperar senha
                </button>
            </form>

            <!-- VOLTAR -->
            <div class="text-center">
                <a class="back-link" href="login.html">
                    <i class="bi bi-arrow-left"></i> Voltar ao login
                </a>
            </div>

        </div>
    </div>

    <script>
        /* ============================================================
           RECUPERAR SENHA - SUMBANEPAY
           Versão: 3.0.0 - RECUPERAÇÃO REAL
           ============================================================ */

        const KEY = 'sumbanepay_';

        // ======== DADOS PADRÃO - APENAS ESTRUTURA VAZIA ========
        const seed = {
            users: [{
                id: 'u1',
                name: 'António Matola',
                business: 'SumbanePay Demo',
                email: 'demo@sumbanepay.co.mz',
                phone: '84 000 0000',
                password: 'demo123'
            }],
            company: {
                name: 'SumbanePay Demo',
                nuit: '400123456',
                phone: '84 000 0000',
                email: 'demo@sumbanepay.co.mz',
                address: 'Av. Julius Nyerere, 123',
                city: 'Maputo',
                logo: '',
                invoicePrefix: 'FT',
                currency: 'MZN',
                currencySymbol: 'MT',
                footer: 'Obrigado pela preferência!'
            },
            settings: { theme: 'light' },
            clients: [],
            products: [],
            sales: [],
            invoices: [],
            payments: [],
            invoiceCounter: 0,
            admin_notifications: []
        };

        // ======== FUNÇÕES ========
        function read(k, f) {
            try {
                const data = localStorage.getItem(KEY + k);
                return data ? JSON.parse(data) : f;
            } catch (e) {
                return f;
            }
        }

        function write(k, v) {
            localStorage.setItem(KEY + k, JSON.stringify(v));
        }

        function toast(t, icon = 'success') {
            Swal.fire({
                toast: true,
                position: 'top-end',
                timer: 3000,
                showConfirmButton: false,
                icon,
                title: t
            });
        }

        // ======== HANDLE RECOVER ========
        function handleRecover(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const emailField = document.getElementById('email');

            if (!email) {
                emailField.classList.add('is-invalid');
                toast('Por favor, insira o seu email.', 'error');
                return;
            }

            emailField.classList.remove('is-invalid');

            // Busca utilizador
            const users = read('users', []);
            const user = users.find(u => u.email === email);

            if (!user) {
                emailField.classList.add('is-invalid');
                toast('Email não encontrado. Verifique e tente novamente.', 'error');
                return;
            }

            // Gera nova senha aleatória
            const newPassword = generateRandomPassword();
            
            // Atualiza a senha do utilizador
            const updatedUsers = users.map(u => {
                if (u.email === email) {
                    return { ...u, password: newPassword };
                }
                return u;
            });
            write('users', updatedUsers);

            // Mostra mensagem de sucesso com a nova senha
            Swal.fire({
                title: '✅ Senha recuperada!',
                html: `
                    <p>Uma nova senha foi gerada para a sua conta.</p>
                    <div style="background:var(--sz-paper);padding:1rem;border-radius:8px;margin:0.5rem 0;">
                        <p style="margin:0;font-size:0.8rem;color:var(--sz-muted);">Nova senha</p>
                        <p style="margin:0;font-size:1.2rem;font-weight:700;color:var(--sz-green);font-family:monospace;letter-spacing:1px;">
                            ${newPassword}
                        </p>
                    </div>
                    <p class="text-muted small" style="margin-top:0.5rem;">
                        <i class="bi bi-info-circle"></i>
                        Recomendamos que altere esta senha após o login.
                    </p>
                `,
                icon: 'success',
                confirmButtonText: 'Ir para o login',
                confirmButtonColor: '#176b5b'
            }).then(() => {
                window.location.href = 'login.html';
            });
        }

        // ======== GERAR SENHA ALEATÓRIA ========
        function generateRandomPassword() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let password = '';
            for (let i = 0; i < 8; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return password;
        }

        // ======== THEME ========
        function toggleTheme() {
            const settings = read('settings', {});
            settings.theme = settings.theme === 'dark' ? 'light' : 'dark';
            write('settings', settings);
            document.body.classList.toggle('dark-mode', settings.theme === 'dark');
        }

        // ======== BOOT ========
        function boot() {
            Object.entries(seed).forEach(([k, v]) => {
                if (localStorage.getItem(KEY + k) === null) {
                    write(k, v);
                }
            });
            const settings = read('settings', {});
            document.body.classList.toggle('dark-mode', settings.theme === 'dark');
        }

        // ======== INICIALIZAÇÃO ========
        document.addEventListener('DOMContentLoaded', function() {
            boot();

            document.getElementById('email').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    handleRecover(e);
                }
            });

            document.getElementById('email').addEventListener('input', function() {
                this.classList.remove('is-invalid');
            });
        });

        window.handleRecover = handleRecover;
        window.toggleTheme = toggleTheme;
        window.read = read;
        window.write = write;
        window.KEY = KEY;
    </script>

    <script src="../mobile.js" defer></script>
</body>
</html>
