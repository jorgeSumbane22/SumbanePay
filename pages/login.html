            --sz-green-light: #1f8a75;
            --sz-dark: #103f37;
            --sz-coral: #ef6d4e;
            --sz-gold: #e8b35b;
            --sz-paper: #f7f6f1;

            --sz-danger: #dc3545;

        [data-theme="dark"] {

            --sz-line: #2a4a3e;
            --sz-white: #162f27;
            --sz-green: #2a9d8f;

        body {

            display: flex;

<body>

    <script>
    /* ============================================================
       LOGIN — SumbanePay
       ------------------------------------------------------------
       ✔ Utilizadores via SPStorage (core/storage-core.js) — mesma
         chave canónica usada por cadastro.html e pelo superadmin,
         eliminando o desalinhamento entre 'sumbanepay_users' e
         'sumbanepay_users_v2' que existia antes
       ✔ Verificação de password via SPAuth (PBKDF2, com migração
         automática de contas legadas em texto plano)
       ✔ SESSION_KEY mantém-se 'sumbanepay_session' — é o nome que
         dashboard.html já espera; não é alterado aqui para não
         quebrar páginas ainda não migradas para core/auth-core.js
       ============================================================ */

    'use strict';

    var SESSION_KEY   = 'sumbanepay_session';
    var SESSION_DURATION = 30 * 60 * 1000;

    var loginAttempts = 0;
    var MAX_ATTEMPTS = 5;
    var LOCK_TIME = 5 * 60 * 1000;
    var lockTimer = null;
    var isLocked = false;

    /* ---------- TEMA ---------- */
    function getStoredTheme() {
        try {
            var v = localStorage.getItem('sumbanepay_theme') || localStorage.getItem('theme');
            if (v === 'dark' || v === 'light') return v;
        } catch (e) {}
        return 'light';
    }

    function applyTheme(t) {
        if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.setAttribute('data-bs-theme', 'dark');
            document.body.classList.add('dark-mode');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.setAttribute('data-bs-theme', 'light');
            document.body.classList.remove('dark-mode');
        }
        try { localStorage.setItem('sumbanepay_theme', t); } catch (e) {}
        var icon = document.getElementById('themeIcon');
        if (icon) icon.className = t === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
    }

    function toggleTheme() {
        applyTheme(getStoredTheme() === 'dark' ? 'light' : 'dark');
    }

    /* ---------- VERIFICAR CREDENCIAIS (Firebase Auth + Firestore) ----------
       Antes, isto lia utilizadores do localStorage — por isso um
       registo feito no telemóvel nunca aparecia no PC (localStorage
       nunca sincroniza entre dispositivos). Agora a conta vive no
       Firebase: funciona a partir de qualquer dispositivo. */
    async function verifyCredentials(email, password) {
        var credential;
        try {
            credential = await SPFirebase.auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
            var authErrors = ['auth/user-not-found', 'auth/wrong-password', 'auth/invalid-credential', 'auth/invalid-login-credentials'];
            if (authErrors.indexOf(err.code) !== -1) {
                return { ok: false, reason: 'wrong_password' };
            }
            return { ok: false, reason: 'firebase_error', error: err };
        }

        var uid = credential.user.uid;
        var doc = await SPFirebase.db.collection('users').doc(uid).get();

        if (!doc.exists) {
            // Conta existe no Auth mas sem perfil no Firestore — não
            // deveria acontecer no fluxo normal (cadastro.html cria os
            // dois juntos), mas não deixamos a pessoa presa sem sessão.
            await SPFirebase.auth.signOut();
            return { ok: false, reason: 'no_profile' };
        }

        var user = Object.assign({ id: uid }, doc.data());

        if (user.status === 'inativo' || user.status === 'suspenso') {
            await SPFirebase.auth.signOut();
            return { ok: false, reason: 'inactive' };
        }

        return { ok: true, user: user };
    }

    /* ---------- TOAST ---------- */
    function toast(msg, icon) {
        icon = icon || 'success';
        Swal.fire({
            toast: true,
            position: 'top-end',
            timer: 3000,
            showConfirmButton: false,
            icon: icon,
            title: msg,
            background: getStoredTheme() === 'dark' ? '#162f27' : '#ffffff',
            color: getStoredTheme() === 'dark' ? '#f0efe8' : '#19362e'
        });
    }

    function togglePasswordVisibility() {
        var input = document.getElementById('password');
        var icon = document.getElementById('passwordIcon');
        if (!input) return;
        if (input.type === 'password') {
            input.type = 'text';
            if (icon) icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            if (icon) icon.className = 'bi bi-eye';
        }
    }

    /* ---------- BLOQUEIO ---------- */
    function lockScreen() {
        isLocked = true;
        var btn = document.getElementById('loginBtn');
        if (btn) btn.disabled = true;
        var warning = document.getElementById('attemptsWarning');
        var text = document.getElementById('attemptsText');
        if (warning) warning.style.display = 'block';
        var remaining = LOCK_TIME / 1000;
        if (text) text.textContent = 'Bloqueado por ' + Math.floor(remaining / 60) + 'm';
        if (lockTimer) clearInterval(lockTimer);
        lockTimer = setInterval(function () {
            remaining--;
            var m = Math.floor(remaining / 60);
            var s = remaining % 60;
            if (text) text.textContent = 'Bloqueado por ' + m + 'm ' + s + 's';
            if (remaining <= 0) {
                clearInterval(lockTimer);
                unlockScreen();
            }
        }, 1000);
    }

    function unlockScreen() {
        isLocked = false;
        if (lockTimer) { clearInterval(lockTimer); lockTimer = null; }
        loginAttempts = 0;
        var w = document.getElementById('attemptsWarning');
        if (w) w.style.display = 'none';
        var b = document.getElementById('loginBtn');
        if (b) b.disabled = false;
    }

    /* ---------- COMPLETAR LOGIN ---------- */
    function completeLogin(user) {
        // Actualiza lastAccess no Firestore (fonte de verdade) — não
        // bloqueia o redireccionamento se isto falhar por qualquer razão.
        SPFirebase.db.collection('users').doc(user.id)
            .update({ lastAccess: new Date().toISOString() })
            .catch(function (e) { console.warn('Não foi possível actualizar lastAccess:', e.message); });

        // Cache local do PRÓPRIO perfil — só para páginas que ainda não
        // foram migradas para Firestore (dashboard.html, perfil.html)
        // conseguirem continuar a mostrar nome/avatar sem reescrever
        // essas páginas. O Firestore continua a ser a fonte de verdade;
        // isto é só um espelho de leitura de UM utilizador (o que está
        // a entrar agora neste dispositivo).
        try {
            SPStorage.forceSet(SPStorage.KEYS.USERS, [user]);
        } catch (e) {}

        var sessionId = 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
        var session = {
            id: sessionId,
            userId: user.id,
            email: user.email,
            name: user.name,
            role: user.role || 'Vendedor',
            loggedInAt: new Date().toISOString(),
            expiresAt: new Date(Date.now() + SESSION_DURATION).toISOString()
        };

        try {
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
            localStorage.setItem(SESSION_KEY, JSON.stringify(session));
            localStorage.setItem('sz_session', user.id);
        } catch (e) {}

        toast('👋 Bem-vindo(a), ' + user.name + '!');
        setTimeout(function () {
            window.location.replace('dashboard.html');
        }, 600);
    }

    /* ---------- LOGIN ---------- */
    async function handleLogin(event) {
        event.preventDefault();
        if (isLocked) { toast('🔒 Aguarde.', 'error'); return; }

        if (document.getElementById('honeypot').value) {
            toast('🚫 Acesso negado.', 'error');
            return;
        }

        var emailField = document.getElementById('email');
        var passwordField = document.getElementById('password');
        var email = emailField.value.trim().toLowerCase();
        var password = passwordField.value;

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            emailField.classList.add('is-invalid');
            toast('Email inválido.', 'error');
            return;
        }
        if (!password || password.length < 6) {
            passwordField.classList.add('is-invalid');
            toast('Senha inválida.', 'error');
            return;
        }
        emailField.classList.remove('is-invalid');
        passwordField.classList.remove('is-invalid');

        var btn = document.getElementById('loginBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>A verificar...';
        }

        try {
            var r = await verifyCredentials(email, password);

            if (r.ok) {
                completeLogin(r.user);
                return;
            }

            if (r.reason === 'firebase_error') {
                toast(SPFirebase.translateAuthError(r.error), 'error');
                return; // não conta como tentativa falhada — não é culpa da password
            }

            loginAttempts++;
            var remaining = MAX_ATTEMPTS - loginAttempts;

            emailField.classList.add('is-invalid');
            passwordField.classList.add('is-invalid');

            var msg = '❌ Credenciais inválidas.';
            if (r.reason === 'inactive') msg = '❌ Conta inactiva. Contacta o suporte.';
            else if (r.reason === 'no_profile') msg = '❌ Conta sem perfil associado. Contacta o suporte.';

            var warning = document.getElementById('attemptsWarning');
            var text = document.getElementById('attemptsText');
            if (warning) warning.style.display = 'block';
            if (text) text.textContent = 'Tentativas restantes: ' + remaining;

            toast(msg + ' ' + remaining + ' tentativas.', 'error');

            if (loginAttempts >= MAX_ATTEMPTS) lockScreen();
        } catch (err) {
            console.error('Erro login:', err);
            toast('Erro ao processar login.', 'error');
        } finally {
            if (btn && !isLocked) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Entrar';
            }
        }
    }

    /* ---------- NAVEGAÇÃO ---------- */
    var MAIN_PAGE = new URL('../index.html', window.location.href).href;
    var leavingToMain = false;

    function goToMain(event) {
        if (event) event.preventDefault();
        if (leavingToMain) return;
        leavingToMain = true;
        window.location.replace(MAIN_PAGE);
    }

    /* ---------- RELÓGIO ---------- */
    function updateClock() {
        var now = new Date();
        var el = document.getElementById('currentTime');
        if (el) el.textContent = now.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
    }

    /* ---------- BOOT ---------- */
    function boot() {
        applyTheme(getStoredTheme());

        try {
            var email = localStorage.getItem('sz_registered_email');
            if (email) {
                var f = document.getElementById('email');
                if (f) f.value = email;
                localStorage.removeItem('sz_registered_email');
                setTimeout(function () {
                    var pwd = document.getElementById('password');
                    if (pwd) pwd.focus();
                }, 300);
            }
        } catch (e) {}

        updateClock();
        setInterval(updateClock, 10000);

        var controls = document.querySelectorAll('.form-control');
        for (var i = 0; i < controls.length; i++) {
            controls[i].addEventListener('input', function () {
                if (this.value.length > 0) this.classList.remove('is-invalid');
            });
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                var active = document.activeElement;
                if (active && (active.id === 'email' || active.id === 'password')) {
                    e.preventDefault();
                    var form = document.getElementById('loginForm');
                    if (form) form.requestSubmit();
                }
            }
        });
    }

    Object.assign(window, {
        handleLogin: handleLogin,
        toggleTheme: toggleTheme,
        togglePasswordVisibility: togglePasswordVisibility,
        goToMain: goToMain
    });

    document.addEventListener('DOMContentLoaded', boot);
    </script>

    <script src="../mobile.js" defer></script>
</body>
</html>
